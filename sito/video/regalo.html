<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<base href="../">
<title>Record reel "The first gift" · UK House by House</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  :root { --ink: #152033; --giallo: #FFC93C; --rosso: #E0473C; --verde: #2FB36A; --rosa: #FF4F8B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1E3560; font-family: 'Nunito', 'Segoe UI Emoji', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; transform-origin: 50% 45%; }
  #vinheta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(10, 16, 32, 0.45) 100%); }
  #scuro { position: absolute; inset: 0; background: #0E1A33; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g, .g { color: var(--giallo); }
  .forte .r { color: #FF8FB8; }
  .pop { position: absolute; opacity: 0; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1440px; text-align: center; font-size: 84px; line-height: 1.12; }
  #sott .w { display: inline-block; transform-origin: 50% 80%; margin: 0 0.06em; }
  .timbro { left: 0; right: 0; text-align: center; }
  .timbro span { display: inline-block; padding: 10px 36px 14px; border: 12px solid currentColor; border-radius: 26px; font-size: 80px; font-weight: 900; text-transform: uppercase; background: rgba(255,255,255,.95); box-shadow: 0 10px 0 rgba(0,0,0,.3); white-space: nowrap; }
  #scambio { left: 0; right: 0; top: 1230px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  #scambio .pill { background: #FFE3EE; border: 7px solid var(--ink); border-radius: 99px; padding: 10px 32px 14px; font-size: 54px; font-weight: 900; color: var(--ink); box-shadow: 0 10px 0 rgba(0,0,0,.3); white-space: nowrap; opacity: 0; }
  #scambio .pill.oro { background: var(--giallo); }
  #scambio .dono { font-size: 96px; opacity: 0; }
  .etichetta { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform-origin: 50% 100%; }
  .card { position: relative; background: #fff; border: 6px solid var(--ink); border-radius: 26px; padding: 10px 30px 14px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.3); }
  .card b { display: block; font-size: 56px; font-weight: 900; color: var(--ink); line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .card small { display: block; font-size: 32px; font-weight: 800; color: #5B6475; line-height: 1.25; white-space: nowrap; }
  .card.oro { background: var(--giallo); }
  .card.oro small { color: #4B3A10; }
  .card.rosa { background: #FFE3EE; }
  .card.rosa small { color: #B0125B; }
  .freccia { width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 18px solid var(--ink); }
  #domanda { left: 30px; right: 30px; top: 260px; text-align: center; font-size: 104px; line-height: 1.05; -webkit-text-stroke-width: 22px; }
  .bolla { position: absolute; left: 0; top: 0; background: #fff; border: 5px solid var(--ink); border-radius: 28px; padding: 14px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.3); opacity: 0; white-space: nowrap; }
  .bolla i { width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--ink); flex: none; }
  .bolla b { font-size: 42px; font-weight: 800; color: var(--ink); }
  .bolla b .t { color: #1E5AA8; }
  .bolla .piu { position: absolute; right: -34px; top: -38px; background: var(--verde); color: #fff; border: 5px solid var(--ink); border-radius: 99px; padding: 2px 16px 6px; font-size: 44px; font-weight: 900; opacity: 0; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  #banner { left: 30px; right: 30px; top: 300px; text-align: center; font-size: 124px; line-height: 1.1; -webkit-text-stroke-width: 22px; }
  #banner div { opacity: 0; }
</style>
</head>
<body>
<canvas id="mappa"></canvas>
<div id="vinheta"></div>
<div id="scuro"></div>
<div id="etichette"></div>
<div id="bolle"></div>
<div id="timbri"></div>
<div id="scambio" class="pop"><div class="pill" id="p-da"></div><div class="dono">🎁</div><div class="pill oro" id="p-a"></div></div>
<div id="domanda" class="pop forte">Who would you<br><span class="r">gift a house?</span> 🎁</div>
<div id="banner" class="pop forte"></div>
<div id="sott" class="forte"></div>
<div id="flash"></div>
<script type="module" src="video/regalo.js"></script>
</body>
</html>

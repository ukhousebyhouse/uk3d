<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<base href="../">
<title>Record reel "The High Street is open" · UK House by House</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="video/reel.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  #insegna { left: 0; right: 0; top: 330px; text-align: center; }
  #insegna .s { display: inline-block; background: #1F3A6B; border: 10px solid var(--ink); border-radius: 18px; padding: 18px 44px 24px; box-shadow: 0 14px 0 rgba(0,0,0,.35); }
  #insegna .s b { display: block; color: #fff; font-size: 104px; font-weight: 900; letter-spacing: 3px; line-height: 1.05; }
  #insegna .s span { display: block; color: var(--giallo); font-size: 84px; font-weight: 900; letter-spacing: 6px; }
  #posti { left: 60px; right: 60px; top: 260px; }
  #posti .pan { background: #fff; border: 8px solid var(--ink); border-radius: 36px; padding: 22px 26px 28px; box-shadow: 0 14px 0 rgba(0,0,0,.3); text-align: center; }
  #posti h3 { margin: 0 0 14px; font-size: 56px; color: var(--ink); text-transform: uppercase; }
  #posti h3 small { display: block; font-size: 28px; color: #5B6475; letter-spacing: 2px; }
  #posti .griglia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  #posti .slot { height: 150px; border: 6px dashed #9AA3AE; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 84px; background: #F4F6F9; }
  #posti .slot.on { border: 6px solid var(--ink); background: #FFF1C2; }
  #posti .slot i { font-style: normal; opacity: 0; }
</style>
</head>
<body>
<canvas id="mappa"></canvas>
<div id="vinheta"></div>
<div id="scuro"></div>
<div id="etichette"></div>
<div id="bolle"></div>
<div id="timbri"></div>
<div id="insegna" class="pop"><div class="s"><b>THE HIGH STREET</b><span>IS OPEN 🏪</span></div></div>
<div id="posti" class="pop"><div class="pan"><h3>🏪 Only 6 shops<small>PER VILLAGE · FIRST COME, FIRST SERVED</small></h3><div class="griglia"></div></div></div>
<div id="banner" class="pop forte"></div>
<div id="sott" class="forte"></div>
<div id="flash"></div>
<script type="module" src="video/highstreet.js"></script>
</body>
</html>

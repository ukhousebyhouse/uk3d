<!-- import maps só existem no Safari 16.4+: em iPhone mais antigo o polyfill carrega os módulos (nos outros não faz nada) -->
<script async src="vendor/es-module-shims.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script>
  // se a mapa não carrega: avisa a pessoa (em vez de girar para sempre) e manda o erro para api/errore.php
  (function () {
    window.__t0 = Date.now(); window.__fase = 'html';
    var enviados = 0;
    function relata(msg) {
      if (enviados++ > 3 || !navigator.sendBeacon) return;
      try { navigator.sendBeacon('api/errore.php', JSON.stringify({ msg: String(msg).slice(0, 300), ua: navigator.userAgent, url: location.href })); } catch (e) {}
    }
    window.__relata = relata;
    // contador anônimo (sem cookies): uma visita por carregamento; main.js manda 'ok' quando a mapa abre
    window.__conta = function (t) { try { navigator.sendBeacon && navigator.sendBeacon('api/visita.php', JSON.stringify({ t: t, p: 'mappa', ref: document.referrer })); } catch (e) {} };
    window.__conta('v');
    window.addEventListener('error', function (e) {
      // ruído do navegador do app do Instagram (scripts dele, iabjs://) e erros opacos: não são nossos
      if (/^iabjs:/.test(e.filename || '') || e.message === 'Script error.') return;
      relata((e.message || 'erro') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
    window.addEventListener('unhandledrejection', function (e) { relata('promise: ' + (e.reason && (e.reason.message || e.reason))); });
    setTimeout(function () {
      var c = document.getElementById('caricamento');
      if (!c || c.classList.contains('fora')) return;
      // fase em que parou + o que já baixou + tipo de rede: separa "lento" de "travado"
      var net = navigator.connection ? ' rete=' + navigator.connection.effectiveType : '';
      window.__lento = true;
      relata('timeout 25 s · fase=' + window.__fase + ' · scaricati=' + Object.keys(window.__fasi || {}).join(',') + net);
      var p = c.querySelector('p');
      if (p) p.innerHTML = 'Taking longer than usual… 🐢<br><small>If you're inside Instagram, tap ⋯ at the top and choose “Open in browser”.</small>';
    }, 25000);
  })();
</script>

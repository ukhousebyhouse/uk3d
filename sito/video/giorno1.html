<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<base href="../">
<title>Record reel "Day one" · UK House by House</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<style>
  :root { --ink: #152033; --giallo: #FFC93C; --rosso: #E0473C; --verde: #2FB36A; --blu: #1E5AA8; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #86AFC4; font-family: 'Nunito', 'Segoe UI Emoji', sans-serif; }
  #mappa { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; transform-origin: 50% 45%; }
  #vinheta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(21, 32, 51, 0.28) 100%); }
  #scuro { position: absolute; inset: 0; background: #152033; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .forte { color: #fff; font-weight: 900; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; letter-spacing: 1px; }
  .forte .g, .g { color: var(--giallo); }
  .pop { position: absolute; opacity: 0; }
  .carta { display: inline-block; background: #fff; border: 8px solid var(--ink); border-radius: 34px; box-shadow: 0 12px 0 rgba(21,32,51,.3); color: var(--ink); font-weight: 900; }
  #sott { position: absolute; left: 40px; right: 40px; top: 1440px; text-align: center; font-size: 84px; line-height: 1.12; }
  #sott .w { display: inline-block; transform-origin: 50% 80%; margin: 0 0.06em; }
  /* relógio do 1º dia e contador */
  #orologio { left: 0; right: 0; top: 120px; text-align: center; }
  #orologio .carta { padding: 8px 40px 14px; min-width: 430px; }
  #orologio small { display: block; font-size: 38px; letter-spacing: 4px; color: #5B6475; }
  #orologio b { display: block; font-size: 110px; line-height: 1; font-variant-numeric: tabular-nums; }
  #orologio.live .carta { background: var(--rosso); color: #fff; }
  #orologio.live small { color: #FFE3DF; }
  #conta { left: 0; right: 0; top: 410px; text-align: center; }
  #conta .num { font-size: 190px; line-height: 1; -webkit-text-stroke-width: 28px; font-variant-numeric: tabular-nums; }
  #conta .lab { font-size: 64px; -webkit-text-stroke-width: 13px; margin-top: 4px; }
  #conta .sub { font-size: 50px; -webkit-text-stroke-width: 11px; margin-top: 6px; }
  .timbro { left: 0; right: 0; text-align: center; }
  .timbro span { display: inline-block; padding: 10px 36px 14px; border: 12px solid currentColor; border-radius: 26px; font-size: 96px; font-weight: 900; text-transform: uppercase; background: rgba(255,255,255,.93); box-shadow: 0 10px 0 rgba(21,32,51,.3); white-space: nowrap; }
  #trovato { top: 780px; color: var(--rosso); }
  #trovato span, #galles span { font-size: 74px; }
  .bolla { position: absolute; left: 0; top: 0; background: #fff; border: 5px solid var(--ink); border-radius: 28px; padding: 12px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 0 rgba(21,32,51,.25); opacity: 0; white-space: nowrap; }
  .bolla i { width: 46px; height: 46px; border-radius: 50%; background: #C9D1DC; border: 4px solid var(--ink); flex: none; }
  .bolla b { font-size: 38px; font-weight: 800; color: var(--ink); }
  .bolla em { font-style: normal; color: #fff; background: var(--verde); border: 3px solid var(--ink); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; }
  .etichetta { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform-origin: 50% 100%; }
  .card { position: relative; background: #fff; border: 6px solid var(--ink); border-radius: 26px; padding: 10px 30px 14px; text-align: center; box-shadow: 0 8px 0 rgba(21,32,51,.25); }
  .card b { display: block; font-size: 56px; font-weight: 900; color: var(--ink); line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .card small { display: block; font-size: 32px; font-weight: 800; color: #5B6475; line-height: 1.25; white-space: nowrap; }
  .card.oro { background: var(--giallo); }
  .card.oro small { color: #4B3A10; }
  .card .medaglia { position: absolute; left: -50px; top: -46px; font-size: 96px; transform: rotate(-12deg); }
  .freccia { width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 18px solid var(--ink); }
  #sblocco { left: 0; right: 0; top: 260px; text-align: center; }
  #sblocco .carta { background: var(--giallo); padding: 10px 44px 16px; }
  #sblocco small { display: block; font-size: 40px; letter-spacing: 3px; }
  #sblocco b { display: block; font-size: 150px; line-height: 1; font-variant-numeric: tabular-nums; }
  #sblocco i { display: block; font-style: normal; font-size: 48px; }
  #nir { left: 0; right: 0; top: 230px; text-align: center; }
  #nir .carta { background: #3A7D7C; padding: 14px 44px 20px; color: #fff; }
  #nir small { display: block; font-size: 46px; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; }
  #nir .riga { position: relative; display: inline-block; }
  #nir b { display: block; font-size: 120px; line-height: 1; -webkit-text-stroke: 20px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
  #nir .barra { position: absolute; left: -10px; right: -10px; top: 52%; height: 22px; background: var(--rosso); border: 5px solid var(--ink); border-radius: 12px; transform-origin: 0 50%; }
  #battaglia { left: 60px; right: 60px; top: 300px; }
  #battaglia .carta { display: block; padding: 22px 30px 26px; }
  #battaglia h3 { margin: 0 0 16px; text-align: center; font-size: 56px; text-transform: uppercase; }
  #battaglia h3 small { display: block; font-size: 30px; color: #5B6475; letter-spacing: 2px; }
  #battaglia .riga { display: flex; align-items: center; gap: 16px; margin: 14px 0; font-size: 38px; }
  #battaglia .nome { width: 330px; white-space: nowrap; }
  #battaglia .barra { flex: 1; height: 54px; background: #EEF1F5; border: 5px solid var(--ink); border-radius: 18px; overflow: hidden; }
  #battaglia .barra i { display: block; height: 100%; }
  #battaglia .cor { width: 70px; font-size: 54px; text-align: center; }
  #galles { top: 1000px; color: #C8102E; }
  #grazie { left: 0; right: 0; top: 560px; text-align: center; font-size: 170px; line-height: 1; -webkit-text-stroke-width: 28px; }
  #grazie .cuore { display: inline-block; }
  #banner { left: 30px; right: 30px; top: 260px; text-align: center; font-size: 120px; line-height: 1.1; -webkit-text-stroke-width: 22px; }
  #banner div { opacity: 0; }
</style>

<canvas id="mappa"></canvas>
<div id="vinheta"></div>
<div id="scuro"></div>
<div id="etichette"></div>

<div id="orologio" class="pop"><div class="carta"><small></small><b></b></div></div>
<div id="conta" class="pop forte"><div class="num g"></div><div class="lab"></div><div class="sub"></div></div>

<div id="nir" class="pop"><div class="carta"><small>⬢ NORTHERN IRELAND</small><div class="riga"><b></b><div class="barra"></div></div></div></div>
<div id="battaglia" class="pop"><div class="carta"><h3>⚔️ Battle of the Nations<small>POINTS PER MILLION PEOPLE</small></h3><div id="righe"></div></div></div>
<div id="galles" class="pop timbro"><span>🏆 Wales is winning!</span></div>
<div id="grazie" class="pop forte">Thank<br>you <span class="cuore">❤️</span></div>
<div id="banner" class="pop forte"></div>
